<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مافیا</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
    }

    .box {
      text-align: center;
      padding: 40px 25px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    p {
      font-size: 20px;
      color: #d1d5db;
      margin-bottom: 30px;
    }

    button {
      border: none;
      padding: 15px 35px;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
      background: #ffffff;
      color: #111827;
    }

    button:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>🎭 مافیا</h1>
    <p>به بازی مافیا خوش آمدید</p>

    <button onclick="startGame()">شروع بازی</button>
  </div>

  <script>
    function startGame() {
      alert("بازی مافیا به‌زودی شروع می‌شود 🎭");
    }
  </script>

</body>
</html>
